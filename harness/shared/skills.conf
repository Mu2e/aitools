# Where the harnesses' skills come from (read by link-skills.py; see there).
# A source is a folder of skills, each a folder with a SKILL.md. Earlier
# sources win when two have a skill of the same name.

# Your own skills, for every harness. Create the folder to use it.
source /exp/mu2e/app/users/$USER/skills

# The Mu2e skills of this repository.
source ../../skills

# Not linked. The pull-request skills act on GitHub (reviews, posting); they
# are left to whoever sets them up on purpose.
exclude reviewing-pull-requests
exclude post-pr-review
exclude pr-digest
