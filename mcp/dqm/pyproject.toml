[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

# Version comes from the nearest git tag (setuptools_scm), not a hand-maintained
# field here -- see ../registry/pyproject.toml's comment for why.
[tool.setuptools_scm]
root = "../.."

[project]
name = "dqm-mcp"
dynamic = ["version"]
description = "Read-only streamable-HTTP MCP server for Mu2e DQM Query Engine access"
readme = "README.md"
requires-python = ">=3.10"
# dqm.reader holds every database query this server makes; it ships in the
# mu2e-dqm distribution in the Mu2e/DQM repository, which is not on PyPI, so
# it is pinned here as a direct git reference -- the same "pin a ref per
# release" arrangement install.sh applies to this package. pandas and requests
# arrive through it and are not repeated here, because nothing in dqm_mcp
# imports them directly. The [web] extra is deliberately not requested: this
# server has no use for dash/plotly.
#
# Two floors, both for the same reason -- a tool that reads part of the
# reader that an older tag does not have fails at call time, which reads like
# a bug in the tool rather than a version mismatch:
#
#   v2.1.0  the alarm tools. list_alarms and get_alarm_causes read
#           dqm.schema.ALARM_LEVELS (the episode severity vocabulary, NOT the
#           limits alarmcode), added after v2.0.0.
#   v2.1.6  the file tools. list_files, get_golden_file and list_golden need
#           DqmReader.files() and .golden(), added in DQM commit 5e5e6b9
#           ("add files and golden to the reader"); v2.1.5 and earlier have
#           neither. Against an older reader those three raise the
#           RuntimeError _require_file_support builds, which names this line;
#           every other tool keeps working.
#
# So v2.1.6 is the floor, and the pin is deliberate rather than tracking
# `main`: a rebuild months from now installs the reader this server was
# tested against. Bump it when adopting a release.
dependencies = [
  "mcp>=2.0.0",
  "mu2e-dqm @ git+https://github.com/Mu2e/DQM@v2.1.6#subdirectory=python"
]

[project.scripts]
dqm-mcp = "dqm_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
script-files = ["scripts/dqm-mcp.sh", "scripts/dqm-mcp-install-unit.sh"]

[tool.setuptools.packages.find]
where = ["src"]
