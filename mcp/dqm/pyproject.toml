[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

# Version comes from the nearest git tag (setuptools_scm), not a hand-maintained
# field here -- see ../registry/pyproject.toml's comment for why.
[tool.setuptools_scm]
root = "../.."

[project]
name = "dqm-mcp"
dynamic = ["version"]
description = "Read-only streamable-HTTP MCP server for Mu2e DQM Query Engine access"
readme = "README.md"
requires-python = ">=3.10"
# dqm.reader holds every database query this server makes; it ships in the
# mu2e-dqm distribution in the Mu2e/DQM repository, which is not on PyPI, so
# it is pinned here as a direct git reference -- the same "pin a ref per
# release" arrangement install.sh applies to this package. pandas and requests
# arrive through it and are not repeated here, because nothing in dqm_mcp
# imports them directly. The [web] extra is deliberately not requested: this
# server has no use for dash/plotly.
#
# Pinned to a DQM tag, so a rebuild months from now installs the same reader
# this server was tested against. Tracking `main` meant whatever happened to
# be there at venv-build time. Bump it deliberately when adopting a release.
#
# v2.1.0 is the floor for the alarm tools, not a preference: list_alarms and
# get_alarm_causes read dqm.schema.ALARM_LEVELS (the episode severity
# vocabulary, which is NOT the limits alarmcode), and that was added after
# v2.0.0. Against v2.0.0 both tools raise AttributeError at call time while
# every other tool keeps working -- so the failure looks like a bug in the
# tools rather than a version mismatch.
dependencies = [
  "mcp>=2.0.0",
  "mu2e-dqm @ git+https://github.com/Mu2e/DQM@v2.1.0#subdirectory=python"
]

[project.scripts]
dqm-mcp = "dqm_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
script-files = ["scripts/dqm-mcp.sh", "scripts/dqm-mcp-install-unit.sh"]

[tool.setuptools.packages.find]
where = ["src"]
