[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqm-mcp"
version = "0.2.0"
description = "Read-only streamable-HTTP MCP server for Mu2e DQM Query Engine access"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0.0",
  "requests>=2.31.0"
]

[project.scripts]
dqm-mcp = "dqm_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
script-files = ["scripts/dqm-mcp.sh", "scripts/dqm-mcp-install-unit.sh"]

[tool.setuptools.packages.find]
where = ["src"]
