[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

# Version comes from the nearest git tag (setuptools_scm), not a hand-maintained
# field here -- see ../registry/pyproject.toml's comment for why.
[tool.setuptools_scm]
root = "../.."

[project]
name = "ecl-mcp"
dynamic = ["version"]
description = "Streamable-HTTP MCP server for the Fermilab ECL logbook, read-only by default, mikey-authenticated"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0.0",
  # Pinned to a tag, not left to float on ecl-api's default branch. Unpinned,
  # a tagged release of this package was not reproducible -- reinstalling the
  # same ecl-mcp tag could pull a different ecl-api -- and that is how
  # ecl-api's `ecl-mcp` console-script alias reached a deployed release
  # unannounced, clobbering bin/ecl-mcp (see scripts/ecl-mcp.sh). Bump this
  # deliberately; ecl-api versions off its own git tags via hatch-vcs.
  "ecl-api @ git+https://github.com/Mu2e/ecl-api@v1.0.0",
  "mikey @ git+https://github.com/Mu2e/aitools#subdirectory=mcp/mikey",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ecl-mcp = "ecl_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
script-files = ["scripts/ecl-mcp.sh", "scripts/ecl-mcp-install-unit.sh"]

[tool.setuptools.packages.find]
where = ["src"]
