[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

# Version comes from the nearest git tag (setuptools_scm), not a hand-maintained
# field here -- see ../registry/pyproject.toml's comment for why.
[tool.setuptools_scm]
root = "../.."

[project]
name = "runs-mcp"
dynamic = ["version"]
description = "Read-only streamable-HTTP MCP server for the Mu2e run database, via the runTool CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0.0",
  "mikey @ git+https://github.com/Mu2e/aitools#subdirectory=mcp/mikey",
]

[project.scripts]
runs-mcp = "runs_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
script-files = ["scripts/runs-mcp.sh", "scripts/runs-mcp-install-unit.sh"]

[tool.setuptools.packages.find]
where = ["src"]
